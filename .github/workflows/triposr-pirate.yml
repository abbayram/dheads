name: Build Pirate with TripoSR

on:
  pull_request:
    branches: [main]
    paths:
      - "triposr-build/**"
      - ".github/workflows/triposr-pirate.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Add swap for CPU inference
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Decode pirate input
        run: |
          mkdir -p triposr-build/input
          base64 --decode triposr-build/pirate_tpose_front.b64 > triposr-build/input/pirate_tpose_front.png
          file triposr-build/input/pirate_tpose_front.png

      - name: Install TripoSR
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1 libglib2.0-0
          git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR.git triposr-build/TripoSR
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.1.2 torchvision==0.16.2
          python -m pip install numpy==1.26.4
          python -m pip install \
            omegaconf==2.3.0 Pillow==10.1.0 einops==0.7.0 \
            transformers==4.35.0 trimesh==4.0.5 rembg==2.0.57 \
            huggingface-hub==0.20.3 "imageio[ffmpeg]" \
            xatlas==0.0.9 moderngl==5.10.0
          python -m pip install git+https://github.com/tatsy/torchmcubes.git

      - name: Generate GLB with TripoSR
        env:
          PYTORCH_ENABLE_MPS_FALLBACK: "1"
        run: |
          cd triposr-build/TripoSR
          python run.py ../input/pirate_tpose_front.png \
            --device cpu \
            --no-remove-bg \
            --mc-resolution 128 \
            --chunk-size 1024 \
            --output-dir ../output \
            --model-save-format glb
          cp ../output/0/mesh.glb ../pirate_triposr.glb
          python - <<'PY'
          import trimesh
          mesh = trimesh.load('../pirate_triposr.glb', force='mesh')
          print(f'vertices={len(mesh.vertices)} faces={len(mesh.faces)} watertight={mesh.is_watertight}')
          PY

      - name: Upload pirate GLB
        uses: actions/upload-artifact@v4
        with:
          name: pirate-triposr-glb
          path: triposr-build/pirate_triposr.glb
          if-no-files-found: error
          retention-days: 7
