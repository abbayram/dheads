name: Build Pirate with TripoSR

on:
  pull_request:
    branches: [main]
    paths:
      - "triposr-build/**"
      - ".github/workflows/triposr-pirate.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decode pirate input
        run: |
          mkdir -p triposr-build/input triposr-build/output
          base64 --decode triposr-build/pirate_tpose_front.b64 > triposr-build/input/pirate_tpose_front.jpg
          file triposr-build/input/pirate_tpose_front.jpg

      - name: Generate GLB using official TripoSR Space
        run: |
          python -m pip install --upgrade pip gradio_client
          python - <<'PY'
          from pathlib import Path
          import shutil
          from gradio_client import Client, handle_file

          image = Path('triposr-build/input/pirate_tpose_front.jpg').resolve()
          output = Path('triposr-build/output/pirate_triposr.glb').resolve()

          client = Client('stabilityai/TripoSR')
          print(client.view_api())

          processed = client.predict(
              handle_file(str(image)),
              False,
              0.85,
              api_name='/preprocess',
          )
          processed_input = handle_file(processed) if isinstance(processed, str) else processed
          result = client.predict(
              processed_input,
              96,
              api_name='/generate',
          )
          print('TripoSR result:', result)

          glb = result[1] if isinstance(result, (tuple, list)) else result
          if isinstance(glb, dict):
              glb = glb.get('path') or glb.get('name')
          if not glb:
              raise RuntimeError(f'No GLB path returned: {result!r}')
          shutil.copyfile(glb, output)
          print('Saved:', output, output.stat().st_size, 'bytes')
          PY

      - name: Upload pirate GLB
        uses: actions/upload-artifact@v4
        with:
          name: pirate-triposr-glb
          path: triposr-build/output/pirate_triposr.glb
          if-no-files-found: error
          retention-days: 7
